[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filinglens"
version = "0.0.1"
description = "Provenance-first SEC filings MCP server: every answer cites its filing, section and date."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chintapenta Sai Srinivas" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/filinglens"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]